<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Personal home economy survival helper" />
    <title>aima</title>
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
    <!-- These make aima work like an app when it is added to the phone's home screen. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="aima" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <!-- Login: the only screen people see before they sign in. -->
      <section id="login" class="screen">
        <img class="logo" src="icons/logo.svg" alt="" width="128" height="128" />
        <h1 class="app-name">aima</h1>
        <button id="sign-in" class="google-button" type="button" disabled>
          <!-- Google's "G" mark, as Google asks sign-in buttons to show it. -->
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            />
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            />
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            />
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            />
          </svg>
          <span data-i18n="signIn">Sign in with Google</span>
        </button>
        <p id="login-message" class="message" role="status" aria-live="polite" hidden></p>
      </section>

      <!-- Checking: we ask the sheet if this person may see it. -->
      <section id="checking" class="screen" hidden>
        <img class="logo logo-small" src="icons/logo.svg" alt="" width="72" height="72" />
        <p class="message" data-i18n="checking">Checking your access…</p>
      </section>

      <!-- Main screen: the text from the sheet, in the middle of the screen. -->
      <section id="briefing" class="screen" hidden>
        <!-- A card with a colored border and a star badge in its top-left corner. -->
        <div class="label">
          <span class="label-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95z"
              />
            </svg>
          </span>
          <p id="briefing-text" class="briefing"></p>
        </div>
        <footer class="account">
          <span id="signed-in-as"></span>
          <button id="sign-out" class="link-button" type="button" data-i18n="signOut">
            Sign out
          </button>
        </footer>
      </section>
    </main>
    <noscript>aima needs JavaScript to work.</noscript>
  </body>
</html>
