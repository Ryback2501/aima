<!doctype html>
<html lang="en" class="loading">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Personal home economy survival helper" />
    <title>aima</title>
    <link rel="icon" href="icons/logo.svg" type="image/svg+xml" />
    <!-- These make aima work like an app when it is added to the phone's home screen. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="aima" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Start loading the font at once, so the app can appear with it. -->
    <link rel="preload" href="fonts/solheavy.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <main>
      <!-- Login: the only screen people see before they sign in. -->
      <section id="login" class="screen">
        <img class="logo" src="icons/logo.svg" alt="" width="128" height="128" />
        <h1 class="app-name">aima</h1>
        <!-- A card. Its look (sizes, colors, corner icon) is set in cards.js. -->
        <button id="sign-in" class="label card-button" data-card="signIn" type="button" disabled>
          <span data-i18n="signIn">Login with Google</span>
        </button>
        <p id="login-message" class="message" role="status" aria-live="polite" hidden></p>
      </section>

      <!-- Checking: we ask the sheet if this person may see it. -->
      <section id="checking" class="screen" hidden>
        <img class="logo logo-small" src="icons/logo.svg" alt="" width="72" height="72" />
        <p class="message" data-i18n="checking">Checking your access…</p>
      </section>

      <!-- Main screen: the Total from the sheet, in the middle of the screen. -->
      <section id="main" class="screen" hidden>
        <!-- A card. Its look (sizes, colors, corner icon) is set in cards.js. -->
        <div class="label" data-card="total">
          <p id="total-value" class="total-value"></p>
        </div>
        <!-- A card. Its look (sizes, colors, corner icon) is set in cards.js. -->
        <button id="sign-out" class="label card-button" data-card="logOut" type="button">
          <span data-i18n="signOut">Log out</span>
        </button>
      </section>
    </main>
    <noscript>aima needs JavaScript to work.</noscript>
  </body>
</html>
